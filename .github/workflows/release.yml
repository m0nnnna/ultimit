# Builds and publishes an Ultimit release on GitHub, so no PC has to: push a version tag
#
#   git tag -a v1.2.0 -m "Ultimit 1.2.0" && git push origin v1.2.0
#
# and this builds the tagged code from scratch (scripts/install.sh, then scripts/build-release.sh)
# in a clean Ubuntu 26.04 container, uploads ultimit-<version>-amd64.tar.gz + .sha256 to the
# release (notes from docs/releases/<tag>.md when there is one, otherwise GitHub's from the
# commits), then runs Sign release, which waits for the owner's approval. Takes about an hour.
# By hand from the Actions tab for a tag that's already pushed (it replaces that release's files).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (v1.2.3)
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0   # (VERSION comes from git describe)
          path: src
      - name: Make room
        # (the build wants 12 GB; the runner's preinstalled SDKs take most of the disk)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: Build in Ubuntu 26.04
        # As on a PC: install.sh as a normal user with sudo, desktop only (no apps, no login
        # screen switch), then build-release.sh packs /opt/ultimit
        run: |
          mkdir -p dist
          docker run --rm -i -e TAG -v "$PWD/src:/src" -v "$PWD/dist:/dist" ubuntu:26.04 bash -s <<'EOF'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          rm -f /etc/dpkg/dpkg.cfg.d/excludes   # (the image leaves out docs and locales)
          apt-get update -q
          apt-get install -y -q sudo git curl ca-certificates
          git config --system --add safe.directory '*'
          useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/builder
          chown -R builder: /src
          sudo -u builder -H /src/scripts/install.sh --yes --no-apps --keep-login-screen
          ver=$(cat /opt/ultimit/VERSION)
          [ "$ver" = "$TAG" ] || { echo "built $ver, not $TAG"; exit 1; }
          # install.sh carries on without these; a release mustn't
          [ -x /opt/ultimit/nekomail/bin/nekomail ] || { echo "NekoMail didn't build"; exit 1; }
          [ -x /opt/ultimit/nekoplayer/nekoplayer ] || { echo "NekoPlayer didn't build"; exit 1; }
          /src/scripts/build-release.sh /dist
          chown -R "$(stat -c %u:%g /dist)" /dist /src
          EOF
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="dist/ultimit-${TAG#v}-amd64.tar.gz"
          ver=$(tar xzOf "$name" opt/ultimit/VERSION | tr -d '[:space:]')
          [ "$ver" = "$TAG" ] || { echo "$name contains $ver, not $TAG"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a rebuild: the old signature no longer matches, Sign release makes a new one
            gh release delete-asset "$TAG" "$(basename "$name").sig" -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true
            gh release upload "$TAG" "$name" "$name.sha256" -R "$GITHUB_REPOSITORY" --clobber
          else
            notes=(--generate-notes)
            [ -f "src/docs/releases/$TAG.md" ] && notes=(--notes-file "src/docs/releases/$TAG.md")
            gh release create "$TAG" "$name" "$name.sha256" -R "$GITHUB_REPOSITORY" \
              --verify-tag --title "Ultimit ${TAG#v}" "${notes[@]}"
          fi
  sign:
    # (a release made with the workflow's token doesn't start other workflows, so call it here)
    needs: build
    uses: ./.github/workflows/sign-release.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
