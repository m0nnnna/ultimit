# Ultimit PinePhone Pro boot menu (eMMC ESP).
# Rescue: hold Volume Down + power -> Tow-Boot boots the SD card (postmarketOS).
# One-shot entry: grub-editenv /boot/efi/grub/grubenv set next_entry=<id>
set timeout=0
set default=ubuntu
set fallback=pmos
load_env --file ($root)/grub/grubenv
if [ "${next_entry}" ]; then
	set default="${next_entry}"
	set next_entry=
	save_env --file ($root)/grub/grubenv next_entry
fi

menuentry "Ubuntu (eMMC)" --id ubuntu {
	search --no-floppy --label --set=root ultimit-root
	linux /boot/vmlinuz root=LABEL=ultimit-root rw console=tty0 console=ttyS2,115200 earlycon=uart8250,mmio32,0xff1a0000 coherent_pool=1M panic=10 loglevel=7
	initrd /boot/initrd.img
	devicetree /boot/ppp.dtb
}

menuentry "postmarketOS (SD)" --id pmos {
	search --no-floppy --label --set=root pmOS_boot
	linux /vmlinuz quiet splash plymouth.ignore-serial-consoles plymouth.prefer-fbcon console=tty0 earlycon=uart8250,mmio32,0xff1a0000 console=ttyS2,115200 panic=10 coherent_pool=1M loglevel=1 mem_sleep_default=s2idle fw_devlink=off pmos_boot_uuid=65B7-A16D pmos_root_uuid=e572a983-fde7-4f38-9f52-11f8a9bd8842 pmos_rootfsopts=defaults
	initrd /initramfs
	devicetree /rk3399-pinephone-pro.dtb
}
