# Managed by Ultimit: replaced on login while this line is here.
# Delete this line to keep your own edits.
# Terminal look: Mine skin (glass black, ice-blue accent).

font=Share Tech Mono:size=12, DejaVu Sans Mono:size=11
pad=12x10
term=foot
# Selecting text copies it to the clipboard too (Windows Terminal style).
selection-target=both

[cursor]
style=beam
blink=yes

[colors]
alpha=0.90
cursor=050607 d4ebff
background=050607
foreground=eef1f4
selection-background=2b3540
selection-foreground=eef1f4
urls=d4ebff
# black red green yellow blue magenta cyan white
regular0=0d0f12
regular1=ff8a8a
regular2=8fe3b0
regular3=ffd98f
regular4=8fbfe8
regular5=c9a8ef
regular6=8fe0e3
regular7=c6ccd3
bright0=5a626d
bright1=ffb0b0
bright2=b5f0cb
bright3=ffe7b5
bright4=d4ebff
bright5=dcc6f5
bright6=b5eef0
bright7=eef1f4

[csd]
# The compositor draws Ultimit titlebars.
preferred=server

[mouse-bindings]
# Right-click pastes, like Windows Terminal (foot has no context menu).
select-extend=none
clipboard-paste=BTN_RIGHT
