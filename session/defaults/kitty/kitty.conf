# Managed by Ultimit: replaced on login while this line is here.
# Delete this line to keep your own edits.
# Terminal look: Mine skin (glass black, ice-blue accent).

font_family Share Tech Mono
font_size 12.0
window_padding_width 10
# Wide enough for tables and htop-style output without wrapping.
initial_window_width 130c
initial_window_height 36c
# Selecting text copies it to the clipboard too (Windows Terminal style).
copy_on_select clipboard
cursor_shape beam
cursor_blink_interval 0.6
background_opacity 0.90
dynamic_background_opacity no

# On Wayland kitty draws its own titlebar; keep it on the background colour.
wayland_titlebar_color background

# Right-click pastes, like Windows Terminal.
mouse_map right press ungrabbed paste_from_clipboard

[colors]
cursor #d4ebff
background #050607
foreground #eef1f4
selection_background #2b3540
selection_foreground #eef1f4
url_color #d4ebff
