<!-- Managed by Ultimit (session/defaults/fontconfig). Delete this line to keep your own edits. -->
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font rendering for an Ultimit session. GNOME's settings daemon used to hand
  these to apps; without it each toolkit guesses, and text comes out thin or
  unhinted. Installed into ~/.config/fontconfig/conf.d and into every Flatpak
  app's own config (sandboxed apps can't read the host's), so the shell,
  native apps and Flatpak browsers all draw text the same way.
-->
<fontconfig>
  <!-- Greyscale antialiasing with light hinting: crisp on every screen,
       including rotated ones, where RGB subpixel order would be wrong. -->
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Generic families (what web pages and apps ask for by default). -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <!-- Ubuntu's default UI font isn't installed on Ultimit. -->
  <alias binding="same">
    <family>Ubuntu Sans</family>
    <accept><family>Noto Sans</family></accept>
  </alias>
</fontconfig>
