# Which xdg-desktop-portal backend answers what in an Ultimit session.
# Read only when XDG_CURRENT_DESKTOP=Ultimit, so GNOME is unaffected.
[preferred]
# File pickers, settings (dark mode, fonts), app chooser, notifications...
default=gtk
# Screenshots and screen sharing (OBS, Discord, browsers) need the wlroots
# backend; the GNOME/GTK ones only work inside GNOME Shell.
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
# No Secret portal backend: oo7 serves org.freedesktop.secrets directly, and
# only Flatpak apps use the portal (add oo7-portal if Flatpak is ever used).
